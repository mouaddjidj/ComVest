name: comvest 
description: A Flutter onboarding app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  smooth_page_indicator: ^1.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.3.3
  video_player: ^2.8.3
  chewie: ^1.5.0
  # ADD THIS LINE:
  intl: 0.20.2  # Required for localization

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/images/onboarding_background.png
    - assets/images/imag2.1.png
    - assets/images/visibilite (1).png
    - assets/images/collaborez.png
    - assets/images/logo.png