name: my_onboarding_app
description: A Flutter onboarding app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  smooth_page_indicator: ^1.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# App icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    # Specific image files used in your onboarding screens
    - assets/images/onboarding_background.png  # Single background for all slides
    - assets/images/imag2.1.png                # First slide foreground image
    - assets/images/visibilite (1).png         # Second slide foreground image  
    - assets/images/collaborez.png             # Third slide foreground image
    - assets/images/logo.png                   # Your app logo