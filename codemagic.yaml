workflows:
  ios-workflow:
    name: Build iOS IPA
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter pub get
      - flutter build ios --release --no-codesign
      - mkdir -p build/ios/ipa/Payload
      - cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
      - cd build/ios/ipa && zip -r ../../../ios_app.ipa Payload
    artifacts:
      - ios_app.ipa
