workflows:
  ios-simulator-build:
    name: Build iOS for Simulator
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter clean
      - flutter pub get
      - flutter build ios --simulator  # Changed to simulator!
      - mkdir -p output
      - cp -r build/ios/iphonesimulator/Runner.app output/
      - cd output && zip -r ../ComVest-simulator.zip Runner.app
    artifacts:
      - ComVest-simulator.zip