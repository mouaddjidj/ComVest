- name: Build iOS
  run: |
    echo "🏗️ Building iOS..."
    flutter build ios --release --no-codesign
    
    # Check if .app was built
    if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
      echo "❌ ERROR: Runner.app not found!"
      echo "Contents of build/ios/iphoneos:"
      ls -la build/ios/iphoneos/ || true
      exit 1
    fi
    
    echo "✅ Runner.app found. Contents:"
    ls -la build/ios/iphoneos/Runner.app/
    
    # Create IPA structure
    mkdir -p build/ios/ipa/Payload
    cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
    
    # Verify copy worked
    if [ ! -f "build/ios/ipa/Payload/Runner.app/Info.plist" ]; then
      echo "❌ ERROR: Info.plist not copied!"
      echo "Contents of build/ios/ipa/Payload/Runner.app:"
      ls -la build/ios/ipa/Payload/Runner.app/ || true
      exit 1
    fi
    
    echo "✅ Info.plist copied successfully"
    
    # Create IPA
    cd build/ios/ipa
    zip -r ../../../ComVest.ipa Payload
    cd ../../..
    
    # Verify IPA was created
    if [ ! -f "ComVest.ipa" ]; then
      echo "❌ ERROR: IPA not created!"
      exit 1
    fi
    
    echo "✅ IPA created successfully"
    echo "IPA size: $(du -h ComVest.ipa | cut -f1)"