name: Build iOS IPA (Diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Show directory structure before build
        run: |
          echo "📁 Current directory contents:"
          ls -la
          echo ""
          echo "📁 iOS folder contents (if exists):"
          ls -la ios/ || echo "No ios folder"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Ensure iOS platform
        run: |
          if [ ! -d "ios" ]; then
            echo "Creating iOS platform..."
            flutter create --platforms=ios .
          fi
      
      - name: Build iOS
        run: |
          echo "🏗️ Building iOS..."
          flutter build ios --release --no-codesign
          
          # Check EVERY possible location for the .app
          echo "🔍 Searching for .app file..."
          find . -name "*.app" -type d | while read app; do
            echo "Found .app at: $app"
            ls -la "$app"
          done
          
          # Check specific locations
          echo ""
          echo "Checking build/ios/iphoneos/:"
          ls -la build/ios/iphoneos/ || echo "Directory not found"
          
          echo ""
          echo "Checking build/ios/Release-iphoneos/:"
          ls -la build/ios/Release-iphoneos/ || echo "Directory not found"
          
          echo ""
          echo "Checking build/ios/ios/Release-iphoneos/:"
          ls -la build/ios/ios/Release-iphoneos/ || echo "Directory not found"
      
      - name: Create IPA
        run: |
          # Try multiple possible locations for the .app
          APP_PATH=""
          
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/Release-iphoneos/Runner.app"
          elif [ -d "build/ios/ios/Release-iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/ios/Release-iphoneos/Runner.app"
          elif [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            APP_PATH="build/ios/iphonesimulator/Runner.app"
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "✅ Found .app at: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            
            # Verify Info.plist exists
            if [ -f "Payload/Runner.app/Info.plist" ]; then
              echo "✅ Info.plist found in .app"
              echo "Bundle ID:"
              grep -A1 CFBundleIdentifier Payload/Runner.app/Info.plist || true
            else
              echo "❌ Info.plist missing in .app!"
              ls -la Payload/Runner.app/
              exit 1
            fi
            
            zip -r ComVest.ipa Payload/
            echo "✅ IPA created: $(ls -la ComVest.ipa)"
          else
            echo "❌ Could not find .app anywhere!"
            echo "Searching entire build directory:"
            find build -name "*.app" -type d || echo "No .app found"
            exit 1
          fi
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ComVest-iOS-App
          path: ComVest.ipa